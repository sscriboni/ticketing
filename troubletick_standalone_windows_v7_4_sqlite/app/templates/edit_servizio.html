<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>Modifica Servizio — {{ cfg.app_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="text-muted small mb-2 fw-bold">{{ cfg.company_name }}</div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Modifica Servizio</h2>
        <div class="text-end">
            {% if user %}<span class="me-3 text-muted d-none d-md-inline-block"><strong>{{ user.nome }} {{ user.cognome }}</strong> ({{ user.ruolo }})</span>{% endif %}
            <a href="/admin/servizi" class="btn btn-outline-secondary btn-sm">Indietro</a>
            <a href="/logout" class="btn btn-outline-secondary btn-sm">Logout</a>
        </div>
    </div>
    <div class="row"><div class="col-12 col-md-8 col-lg-6 mx-auto bg-white p-4 rounded shadow-sm">
        <form method="post" action="/admin/servizio/{{ servizio.servizio_id }}/modifica">
            <div class="mb-3"><label class="form-label fw-bold">Nome Servizio</label>
            <input type="text" name="descrizione" class="form-control" value="{{ servizio.descrizione }}" required></div>
            <div class="mb-3"><label class="form-label fw-bold">Descrizione (max 250 car.)</label>
            <textarea name="descrizione_lunga" class="form-control" rows="3" maxlength="250" placeholder="Spiegazione sintetica del servizio...">{{ servizio.descrizione_lunga or '' }}</textarea></div>
            <div class="mb-4"><label class="form-label fw-bold">Reparto</label>
            <select name="reparto_id" class="form-select" required>
                <option value="" disabled>Seleziona reparto</option>
                {% for reparto in reparti %}
                <option value="{{ reparto.reparto_id }}" {% if reparto.reparto_id == servizio.reparto_id %}selected{% endif %}>{{ reparto.nome }}</option>
                {% endfor %}
            </select></div>
            <div class="mb-4 form-check form-switch">
                <input type="checkbox" name="accetta_ticket" class="form-check-input" value="1" id="chkAccettaEdit" {% if servizio.accetta_ticket %}checked{% endif %}>
                <label class="form-check-label" for="chkAccettaEdit">Abilita ricezione ticket (visibile nel form pubblico)</label>
            </div>
            <div class="d-flex gap-2"><button type="submit" class="btn btn-primary">Salva Modifiche</button>
            <a href="/admin/servizi" class="btn btn-outline-secondary">Annulla</a></div>
        </form>
    </div></div>
</div>
</body></html>
