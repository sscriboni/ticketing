<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Reimposta Password — {{ cfg.app_title }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
{% include 'base_script.html' %}
</head>
<body class="bg-light"><div class="container py-5" style="max-width:520px">
<h2>Nuova Password</h2>
{% if error %}<div class="alert alert-danger mt-3">{{ error }}</div>{% endif %}
<form method="post" action="/reset-password" class="mt-3 bg-white p-4 rounded shadow-sm">
  <input type="hidden" name="token" value="{{ token }}">
  <div class="mb-3"><label class="form-label fw-bold">Nuova Password</label><input type="password" name="new_password" class="form-control" required></div>
  <button class="btn btn-primary w-100">Salva e Accedi</button>
</form>
</div></body></html>
