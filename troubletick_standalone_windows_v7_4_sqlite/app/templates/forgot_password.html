<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Password dimenticata — {{ cfg.app_title }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container py-5" style="max-width:520px">
<h2>Recupero Password</h2>
{% if success %}<div class="alert alert-success mt-3">{{ success }}</div>{% endif %}
<form method="post" action="/forgot-password" class="mt-3 bg-white p-4 rounded shadow-sm">
  <p class="text-muted">Inserisci l'indirizzo email associato al tuo account. Ti invieremo un link per reimpostare la password.</p>
  <div class="mb-3"><label class="form-label fw-bold">Email</label><input type="email" name="email" class="form-control" required></div>
  <button class="btn btn-primary w-100">Richiedi Link di Reset</button>
  <div class="text-center mt-3"><a href="/login" class="text-decoration-none">Torna al Login</a></div>
</form>
</div></body></html>
