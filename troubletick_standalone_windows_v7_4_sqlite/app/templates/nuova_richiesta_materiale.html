<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Nuova Richiesta Materiale — {{ cfg.app_title }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light"><div class="container py-4">
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="mb-0"><i class="bi bi-box-seam"></i> Nuova Richiesta Materiale</h2>
  <a href="/richieste-materiale" class="btn btn-outline-secondary">Annulla</a>
</div>

<div class="card shadow-sm"><div class="card-body">
  <form method="post" action="/richiesta-materiale/nuova">
    {% if ticket_id %}
    <input type="hidden" name="ticket_id" value="{{ ticket_id }}">
    <div class="alert alert-info py-2">
      Questa richiesta sarà collegata al Ticket <strong>#{{ ticket_id }}</strong>.
    </div>
    {% endif %}
    
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label">Sede di destinazione</label>
        <select name="sede_dest_id" class="form-select" required>
          <option value="">-- Seleziona Sede --</option>
          {% for s in sedi %}
          <option value="{{ s.sede_id }}">{{ s.nome }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Categoria</label>
        <select name="categoria_id" class="form-select" id="categoriaSelect" required>
          <option value="">-- Seleziona Categoria --</option>
          {% for c in categorie %}
          <option value="{{ c.categoria_id }}">{{ c.nome }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    
    <div class="row g-3 mb-4">
      <div class="col-md-8">
        <label class="form-label">Tipologia / Materiale</label>
        <select name="materiale_id" class="form-select" id="materialeSelect" required>
          <option value="">-- Seleziona prima la categoria --</option>
          {% for m in materiali %}
          <option value="{{ m.materiale_id }}" data-categoria="{{ m.categoria_id }}">{{ m.nome }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Quantità</label>
        <input type="number" name="quantita" class="form-control" min="1" value="1" required>
      </div>
    </div>
    
    <div class="mb-4">
      <label for="magazzino_id" class="form-label">Magazzino di prelievo</label>
      <select name="magazzino_id" id="magazzino_id" class="form-select">
        <option value="">-- Nessun magazzino (Opzionale) --</option>
        {% for mag in magazzini %}
        <option value="{{ mag.magazzino_id }}">{{ mag.nome }}</option>
        {% endfor %}
      </select>
    </div>
    
    <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> Inoltra Richiesta</button>
  </form>
</div></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const catSelect = document.getElementById('categoriaSelect');
    const matSelect = document.getElementById('materialeSelect');
    
    function filterMateriali() {
        const catId = parseInt(catSelect.value);
        Array.from(matSelect.options).forEach(opt => {
            if (opt.value === "") return;
            let isMatch = parseInt(opt.dataset.categoria) === catId;
            opt.style.display = isMatch ? '' : 'none';
            if (!isMatch && opt.selected) matSelect.value = "";
        });
    }
    catSelect.addEventListener('change', filterMateriali);
    filterMateriali();
});
</script>
</body></html>
