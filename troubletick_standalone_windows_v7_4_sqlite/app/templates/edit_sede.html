<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>Modifica Sede — {{ cfg.app_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="text-muted small mb-2 fw-bold">{{ cfg.company_name }}</div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Modifica Sede</h2>
        <div class="text-end">
            {% if user %}<span class="me-3 text-muted d-none d-md-inline-block"><strong>{{ user.nome }} {{ user.cognome }}</strong> ({{ user.ruolo }})</span>{% endif %}
            <a href="/admin/sedi" class="btn btn-outline-secondary btn-sm">Indietro</a>
            <a href="/logout" class="btn btn-outline-secondary btn-sm">Logout</a>
        </div>
    </div>
    <div class="row">
        <div class="col-12 col-md-8 col-lg-6 mx-auto bg-white p-4 rounded shadow-sm">
            <form method="post" action="/admin/sede/{{ sede.sede_id }}/modifica">
                <div class="mb-4">
                    <label class="form-label fw-bold">Nome</label>
                    <input type="text" name="nome" class="form-control" value="{{ sede.nome }}" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Indirizzo</label>
                    <input type="text" name="indirizzo" class="form-control" value="{{ sede.indirizzo or '' }}">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Comune</label>
                    <select name="comune_id" class="form-select">
                        <option value="">Nessun comune</option>
                        {% for c in comuni %}
                        <option value="{{ c.comune_id }}" {% if sede.comune_id == c.comune_id %}selected{% endif %}>{{ c.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Salva Modifiche</button>
                    <a href="/admin/sedi" class="btn btn-outline-secondary">Annulla</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
