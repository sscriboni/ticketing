<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>Modifica Prenotazione — {{ cfg.app_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="text-muted small mb-2 fw-bold">{{ cfg.company_name }}</div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Modifica Prenotazione</h2>
        <div class="text-end">
            {% if user %}<span class="me-3 text-muted d-none d-md-inline-block"><strong>{{ user.nome }} {{ user.cognome }}</strong> ({{ user.ruolo }})</span>{% endif %}
            <a href="/consegne-programmate" class="btn btn-outline-secondary btn-sm">Indietro</a>
            <a href="/logout" class="btn btn-outline-secondary btn-sm">Logout</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form action="/consegna-programmata/{{ consegna.consegna_id }}/modifica" method="post">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Data Richiesta</label>
                        <input type="date" class="form-control" name="data_programmata" value="{{ consegna.data_programmata }}" required>
                        
                        <div class="form-check mt-2 border rounded p-2 bg-light">
                            <input class="form-check-input" type="checkbox" name="quando_disponibile" value="1" id="checkDisponibile" {% if consegna.quando_disponibile %}checked{% endif %}>
                            <label class="form-check-label fw-bold" for="checkDisponibile">Consegna quando materiale disponibile</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Quantità</label>
                        <input type="number" class="form-control" name="quantita" value="{{ consegna.quantita }}" min="1" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Sede Assegnazione</label>
                        <select class="form-select" name="sede_assegnazione_id">
                            <option value="">-- Nessuna Sede --</option>
                            {% for s in sedi %}
                            <option value="{{ s.sede_id }}" {% if s.sede_id == consegna.sede_assegnazione_id %}selected{% endif %}>{{ s.nome }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Posizione Fisica</label>
                        <input type="text" class="form-control" name="posizione_fisica" value="{{ consegna.posizione_fisica }}">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Marca</label>
                        <input type="text" class="form-control" name="marca" value="{{ consegna.marca }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Modello</label>
                        <input type="text" class="form-control" name="modello" value="{{ consegna.modello }}">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Descrizione / Note</label>
                    <textarea class="form-control" name="descrizione" rows="3">{{ consegna.descrizione }}</textarea>
                </div>

                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Salva Modifiche</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
