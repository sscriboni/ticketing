﻿﻿﻿﻿<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Login — {{ cfg.app_title }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light d-flex flex-column min-vh-100">
{% include 'navbar.html' %}

<div class="container flex-grow-1 mb-5" style="max-width:520px">
<h2>Accesso</h2>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
{% if msg %}<div class="alert alert-success">{{ msg }}</div>{% endif %}
<form method="post" action="/login" class="mt-3">
  <div class="mb-3"><label class="form-label">Username o Email</label><input type="text" name="username" class="form-control" required></div>
  <div class="mb-4">
    <label class="form-label">Password</label>
    <div class="input-group">
        <input type="password" name="password" id="loginPassword" class="form-control" required>
        <button class="btn btn-outline-secondary" type="button" id="togglePassword" title="Mostra/Nascondi password">
            <i class="bi bi-eye" id="toggleIcon"></i>
        </button>
    </div>
  </div>
  <div class="d-flex justify-content-between align-items-center">
    <button class="btn btn-primary">Accedi</button>
    <a href="/forgot-password" class="text-decoration-none small">Password dimenticata?</a>
  </div>
  <hr class="my-4">
  <a href="/register" class="btn btn-outline-secondary w-100">Nuovo operatore? Registrati</a>
</form>
</div>

<footer class="bg-dark text-white text-center py-3 mt-auto">
  <div class="container">
    <p class="mb-0 small">{{ cfg.footer_text }}</p>
    <p class="mb-0 small mt-1">
      <a href="/static/PRIVACY.md" class="text-white-50 text-decoration-none me-3" target="_blank">Privacy Policy</a>
      <a href="/static/LICENSE.txt" class="text-white-50 text-decoration-none" target="_blank">Licenza d'Uso (EULA)</a>
    </p>
  </div>
</footer>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('loginPassword');
    const toggleIcon = document.getElementById('toggleIcon');

    if (togglePassword && passwordInput) {
        togglePassword.addEventListener('click', function () {
            // Alterna il tipo di input tra 'password' e 'text'
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Alterna le icone di Bootstrap (occhio aperto / occhio barrato)
            toggleIcon.classList.toggle('bi-eye');
            toggleIcon.classList.toggle('bi-eye-slash');
        });
    }
});
</script>

</body></html>
