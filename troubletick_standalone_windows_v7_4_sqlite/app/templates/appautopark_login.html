<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>Accedi — Autopark Premium</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #312e81 100%);
            --card-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
            --font-outfit: 'Outfit', sans-serif;
            --font-inter: 'Inter', sans-serif;
        }

        body {
            font-family: var(--font-inter);
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Background glow spheres */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(100px);
            opacity: 0.3;
        }

        body::before {
            top: 10%;
            left: 15%;
            background: #4f46e5;
        }

        body::after {
            bottom: 10%;
            right: 15%;
            background: #06b6d4;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 3rem 2.5rem;
            box-shadow: var(--card-shadow);
        }

        .logo-section {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            display: inline-block;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h2 {
            font-family: var(--font-outfit);
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .form-control-premium {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-radius: 14px;
            padding: 12px 18px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control-premium:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25);
            color: #ffffff;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .btn-login {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 12px;
            font-weight: 600;
            font-family: var(--font-outfit);
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            margin-top: 1rem;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            box-shadow: 0 6px 22px rgba(99, 102, 241, 0.45);
            transform: translateY(-2px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .footer-links {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #64748b;
        }

        .footer-links a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: #6366f1;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card text-center">
        <div class="logo-section">🚗</div>
        <h2 class="mb-1">Autopark Premium</h2>
        <p class="text-muted small mb-4">Accedi con le credenziali aziendali di Troubletick</p>
        
        {% if error %}
        <div class="alert alert-danger border-0 rounded-4 py-2.5 small text-start mb-4" style="background: rgba(239, 68, 68, 0.15); color: #fca5a5;">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
        </div>
        {% endif %}
        
        <form action="/login" method="post">
            <div class="mb-3 text-start">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control form-control-premium" id="username" name="username" placeholder="Inserisci il tuo username" required autofocus>
            </div>
            
            <div class="mb-4 text-start">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control form-control-premium" id="password" name="password" placeholder="Inserisci la tua password" required>
            </div>
            
            <button type="submit" class="btn btn-login w-100 py-3">Accedi alla Dashboard</button>
        </form>
        
        <div class="footer-links">
            <a href="http://localhost:5001/" target="_blank"><i class="bi bi-arrow-left-short"></i> Torna a Troubletick</a>
        </div>
    </div>
</div>

</body>
</html>
