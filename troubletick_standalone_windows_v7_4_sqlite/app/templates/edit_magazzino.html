<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>Modifica Magazzino — {{ cfg.app_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="text-muted small mb-2 fw-bold">{{ cfg.company_name }}</div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Modifica Magazzino</h2>
        <div class="text-end">
            {% if user %}<span class="me-3 text-muted d-none d-md-inline-block"><strong>{{ user.nome }} {{ user.cognome }}</strong> ({{ user.ruolo }})</span>{% endif %}
            <a href="/admin/magazzini" class="btn btn-outline-secondary btn-sm">Indietro</a>
            <a href="/logout" class="btn btn-outline-secondary btn-sm">Logout</a>
        </div>
    </div>
    <div class="row">
        <div class="col-12 col-md-8 col-lg-6 mx-auto bg-white p-4 rounded shadow-sm">
            <form method="post" action="/admin/magazzino/{{ magazzino.magazzino_id }}/modifica">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nome</label>
                    <input type="text" name="nome" class="form-control" value="{{ magazzino.nome }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Sede</label>
                    <select name="sede_id" class="form-select">
                        <option value="">-- Nessuna Sede --</option>
                        {% for sede in sedi %}
                        <option value="{{ sede.sede_id }}" {% if sede.sede_id == magazzino.sede_id %}selected{% endif %}>{{ sede.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Categoria Preferita</label>
                    <select name="categoria_id" class="form-select">
                        <option value="">-- Nessuna Categoria --</option>
                        {% for categoria in categorie %}
                        <option value="{{ categoria.categoria_id }}" {% if categoria.categoria_id == magazzino.categoria_id %}selected{% endif %}>{{ categoria.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Reparto Associato</label>
                    <select name="reparto_id" class="form-select">
                        <option value="">-- Nessun Reparto --</option>
                        {% for reparto in reparti %}
                        <option value="{{ reparto.reparto_id }}" {% if reparto.reparto_id == magazzino.reparto_id %}selected{% endif %}>{{ reparto.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Salva Modifiche</button>
                    <a href="/admin/magazzini" class="btn btn-outline-secondary">Annulla</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
