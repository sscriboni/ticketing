<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>Modifica Utente — {{ cfg.app_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="text-muted small mb-2 fw-bold">{{ cfg.company_name }}</div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Modifica Utente</h2>
        <div class="text-end">
            {% if user %}<span class="me-3 text-muted d-none d-md-inline-block"><strong>{{ user.nome }} {{ user.cognome }}</strong> ({{ user.ruolo }})</span>{% endif %}
            <a href="/admin/utenti" class="btn btn-outline-secondary btn-sm">Indietro</a>
            <a href="/logout" class="btn btn-outline-secondary btn-sm">Logout</a>
        </div>
    </div>

    <div class="row">
        <div class="col-12 col-lg-8 mx-auto">
            <div class="bg-white p-4 rounded shadow-sm">
                <h4 class="mb-4">{{ utente.nome }} {{ utente.cognome }}</h4>

                <form method="post" action="/admin/utente/{{ utente.user_id }}/modifica">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Nome <span class="text-danger">*</span></label>
                            <input type="text" name="nome" class="form-control" value="{{ utente.nome }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Cognome <span class="text-danger">*</span></label>
                            <input type="text" name="cognome" class="form-control" value="{{ utente.cognome }}" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Email <span class="text-danger">*</span></label>
                            <input type="email" name="email" class="form-control" value="{{ utente.email }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Nuova Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Lascia vuoto per non modificare">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Telefono</label>
                            <input type="text" name="telefono" class="form-control" value="{{ utente.telefono or '' }}" placeholder="es: 3331234567">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Ultimo Accesso</label>
                            <input type="text" class="form-control" value="{{ utente.ultimo_accesso or 'Mai effettuato' }}" disabled>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Reparto <span class="text-danger">*</span></label>
                            <select name="reparto_id" class="form-select" required>
                                <option value="" disabled>Seleziona reparto</option>
                                {% for reparto in reparti %}
                                <option value="{{ reparto.reparto_id }}" {% if reparto.reparto_id == utente.reparto_id %}selected{% endif %}>
                                    {{ reparto.nome }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Sede assegnata <span class="text-danger">*</span></label>
                            <select name="sede_id" class="form-select" required>
                                <option value="" disabled>Seleziona sede assegnata</option>
                                {% for sede in sedi %}
                                <option value="{{ sede.sede_id }}" {% if sede.sede_id == utente.sede_id %}selected{% endif %}>
                                    {{ sede.nome }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Ruoli <span class="text-danger">*</span></label>
                            <div class="border p-2 rounded bg-light" style="max-height: 150px; overflow-y: auto;">
                                {% for r in ruoli %}
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="ruoli" value="{{ r.nome }}" id="ruolo_{{ r.nome }}"
                                           {% if r.nome in utente_ruoli %}checked{% endif %}>
                                    <label class="form-check-label" for="ruolo_{{ r.nome }}">
                                        {{ r.descrizione }}
                                    </label>
                                </div>
                                {% endfor %}
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold d-block">Stato Utente</label>
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" name="attivo" value="1" id="attivoSwitch" {% if utente.attivo %}checked{% endif %}>
                                <label class="form-check-label" for="attivoSwitch">Utente Attivo</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold d-block">Opzioni Speciali</label>
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" name="is_test" value="1" id="isTestCheckbox" {% if utente.is_test %}checked{% endif %}>
                                <label class="form-check-label" for="isTestCheckbox">Utente di Test (is_test)</label>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 text-end">
                        <a href="/admin/utenti" class="btn btn-outline-secondary">Annulla</a>
                        <button type="submit" class="btn btn-primary">Salva Modifiche</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
