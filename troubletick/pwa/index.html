<!doctype html>
<html lang="it" class="h-full bg-slate-900 text-slate-100">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d6efd" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description"
    content="PWA Troubletick — Assistenza tecnica, Carpooling e Presenze Operatori in React e Tailwind" />

  <title>Troubletick PWA — React & Tailwind</title>

  <!-- Manifest PWA -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <!-- Tailwind CSS CDN Fallback / Dev script -->
  <script src="tailwind.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0d6efd',
              600: '#0257ce',
              700: '#0346a5',
            }
          }
        }
      }
    }
  </script>

  <!-- Font Google Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body
  class="h-full flex flex-column bg-slate-950 text-slate-100 antialiased selection:bg-brand-500 selection:text-white">
  <div id="root" class="min-h-full w-full"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
