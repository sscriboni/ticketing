<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>Modifica Reparto — {{ cfg.app_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="text-muted small mb-2 fw-bold">{{ cfg.company_name }}</div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Modifica Reparto</h2>
        <div class="text-end">
            {% if user %}<span class="me-3 text-muted d-none d-md-inline-block"><strong>{{ user.nome }} {{ user.cognome }}</strong> ({{ user.ruolo }})</span>{% endif %}
            <a href="/admin/reparti" class="btn btn-outline-secondary btn-sm">Indietro</a>
            <a href="/logout" class="btn btn-outline-secondary btn-sm">Logout</a>
        </div>
    </div>
    <div class="row"><div class="col-12 col-md-10 col-lg-8 mx-auto bg-white p-4 rounded shadow-sm">
        <form method="post" action="/admin/reparto/{{ reparto.reparto_id }}/modifica">
            <div class="mb-3"><label class="form-label fw-bold">Nome</label>
            <input type="text" name="nome" class="form-control" value="{{ reparto.nome }}" required></div>
            <div class="mb-4"><label class="form-label fw-bold">Descrizione</label>
            <input type="text" name="descrizione" class="form-control" value="{{ reparto.descrizione or '' }}"></div>
            <div class="mb-3 form-check">
                <input type="checkbox" name="accetta_ticket" value="1" class="form-check-input" id="checkAt" {% if reparto.accetta_ticket %}checked{% endif %}>
                <label class="form-check-label fw-bold" for="checkAt">Reparto di Supporto (visibile nell'apertura ticket)</label>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" name="reperibilita_h24" value="1" class="form-check-input" id="checkEditRep" {% if reparto.reperibilita_h24 %}checked{% endif %}>
                <label class="form-check-label fw-bold" for="checkEditRep">Reperibilità h24</label>
            </div>
            
            <div class="mb-4" id="divOrarioEditRep" style="display: {% if reparto.reperibilita_h24 %}block{% else %}none{% endif %};">
                <!-- Sezione Feriali -->
                <div class="card p-3 mb-3 bg-light border-0 rounded-3">
                  <h6 class="fw-bold text-dark mb-2"><i class="bi bi-calendar-week me-1"></i>Turni Giorni Feriali</h6>
                  <div class="mb-2">
                    <label class="form-label small fw-bold">Orario inizio giorni feriali</label>
                    <input type="time" name="reperibilita_orario_inizio" id="feriale_inizio" class="form-control form-control-sm" value="{{ reparto.reperibilita_orario_inizio or '18:00' }}">
                    <small class="text-muted d-block mt-1">Orario di partenza del primo turno nei feriali.</small>
                  </div>
                  <label class="form-label small fw-bold mb-1">Turni configurati</label>
                  <div id="feriale_turni_container"></div>
                  <button type="button" class="btn btn-outline-primary btn-sm mt-1" onclick="addTurnoRow('feriale', 6)">
                    <i class="bi bi-plus-circle me-1"></i>Aggiungi Turno Feriale
                  </button>
                  <div id="feriale_summary" class="small text-muted mt-2 fw-semibold"></div>
                </div>

                <!-- Sezione Festivi -->
                <div class="card p-3 mb-3 bg-light border-0 rounded-3">
                  <h6 class="fw-bold text-dark mb-2"><i class="bi bi-calendar-event me-1"></i>Turni Giorni Festivi</h6>
                  <div class="mb-2">
                    <label class="form-label small fw-bold">Orario inizio giorni festivi</label>
                    <input type="time" name="reperibilita_festivo_inizio" id="festivo_inizio" class="form-control form-control-sm" value="{{ reparto.reperibilita_festivo_inizio or '08:00' }}">
                    <small class="text-muted d-block mt-1">Orario di partenza del primo turno nei festivi.</small>
                  </div>
                  <label class="form-label small fw-bold mb-1">Turni configurati</label>
                  <div id="festivo_turni_container"></div>
                  <button type="button" class="btn btn-outline-primary btn-sm mt-1" onclick="addTurnoRow('festivo', 12)">
                    <i class="bi bi-plus-circle me-1"></i>Aggiungi Turno Festivo
                  </button>
                  <div id="festivo_summary" class="small text-muted mt-2 fw-semibold"></div>
                </div>
            </div>

            <div class="d-flex gap-2"><button type="submit" class="btn btn-primary">Salva Modifiche</button>
            <a href="/admin/reparti" class="btn btn-outline-secondary">Annulla</a></div>
        </form>
    </div></div>
</div>
<script>
  function addTurnoRow(tipo, defaultDurata = 6) {
    const container = document.getElementById(tipo + '_turni_container');
    if (!container) return;
    const currentCount = container.querySelectorAll('.shift-row').length;
    const row = document.createElement('div');
    row.className = 'shift-row card p-2 mb-2 bg-white border shadow-xs';
    row.dataset.tipo = tipo;
    row.innerHTML = `
      <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap">
        <span class="small fw-bold shift-label">Turno ${currentCount + 1}:</span>
        <div class="input-group input-group-sm" style="max-width: 140px;">
          <input type="number" step="0.5" min="0.5" max="24" name="${tipo}_turni_durata" class="form-control shift-duration" value="${defaultDurata}" required>
          <span class="input-group-text">ore</span>
        </div>
        <span class="badge bg-secondary shift-time-badge">—</span>
        <button type="button" class="btn btn-outline-danger btn-sm py-0 px-2 btn-remove-shift" title="Rimuovi turno">&times;</button>
      </div>
    `;
    const durInput = row.querySelector('.shift-duration');
    durInput.addEventListener('input', () => recalcTurni(tipo));
    durInput.addEventListener('change', () => recalcTurni(tipo));

    row.querySelector('.btn-remove-shift').addEventListener('click', () => {
      row.remove();
      recalcTurni(tipo);
    });
    container.appendChild(row);
    recalcTurni(tipo);
  }

  function recalcTurni(tipo) {
    const container = document.getElementById(tipo + '_turni_container');
    const startInput = document.getElementById(tipo + '_inizio');
    const summaryEl = document.getElementById(tipo + '_summary');
    if (!container || !startInput) return;

    const rows = container.querySelectorAll('.shift-row');
    let [startH, startM] = (startInput.value || (tipo === 'festivo' ? '08:00' : '18:00')).split(':').map(Number);
    if (isNaN(startH)) startH = (tipo === 'festivo' ? 8 : 18);
    if (isNaN(startM)) startM = 0;

    let currentMinutes = startH * 60 + startM;
    let totalHours = 0;

    rows.forEach((row, index) => {
      const label = row.querySelector('.shift-label');
      const durInput = row.querySelector('.shift-duration');
      const badge = row.querySelector('.shift-time-badge');
      if (!durInput) return;

      const durValStr = (durInput.value || '').toString().replace(',', '.');
      const durHours = parseFloat(durValStr) || 0;

      if (label) {
        label.textContent = `Turno ${index + 1}:`;
      }

      const startTotalMin = currentMinutes;
      const endTotalMin = currentMinutes + Math.round(durHours * 60);
      totalHours += durHours;
      currentMinutes = endTotalMin;

      const formatTimeWithDay = (totalMins) => {
        const dayOffset = Math.floor(totalMins / (24 * 60));
        const mInDay = totalMins % (24 * 60);
        const h = Math.floor(mInDay / 60).toString().padStart(2, '0');
        const m = (mInDay % 60).toString().padStart(2, '0');
        return `${h}:${m}${dayOffset > 0 ? ` (+${dayOffset}g)` : ''}`;
      };

      const sFormatted = formatTimeWithDay(startTotalMin);
      const eFormatted = formatTimeWithDay(endTotalMin);
      if (badge) {
        badge.textContent = `${sFormatted} - ${eFormatted}`;
        badge.className = 'badge bg-warning text-dark border border-warning-subtle shift-time-badge';
      }
    });

    if (summaryEl) {
      if (rows.length === 0) {
        summaryEl.textContent = 'Nessun turno definito.';
      } else {
        const endOffset = Math.floor(currentMinutes / (24 * 60));
        const endMins = currentMinutes % (24 * 60);
        const endH = Math.floor(endMins / 60).toString().padStart(2, '0');
        const endM = (endMins % 60).toString().padStart(2, '0');
        const dayText = endOffset > 0 ? ` (+${endOffset} gg)` : '';
        summaryEl.innerHTML = `Copertura totale: <strong>${totalHours} ore</strong> (fino alle ${endH}:${endM}${dayText})`;
      }
    }
  }

  // Precaricamento turni esistenti passati dal backend
  const existingFeriali = [
    {% for t in turni_feriali %}
    {{ t.durata_ore }},
    {% endfor %}
  ];
  const existingFestivi = [
    {% for t in turni_festivi %}
    {{ t.durata_ore }},
    {% endfor %}
  ];

  if (existingFeriali.length > 0) {
    existingFeriali.forEach(d => addTurnoRow('feriale', d));
  } else {
    {% if reparto.reperibilita_h24 %}
    addTurnoRow('feriale', 6);
    {% endif %}
  }

  if (existingFestivi.length > 0) {
    existingFestivi.forEach(d => addTurnoRow('festivo', d));
  } else {
    {% if reparto.reperibilita_h24 %}
    addTurnoRow('festivo', 12);
    {% endif %}
  }

  const chkEdit = document.getElementById('checkEditRep');
  const divOraEdit = document.getElementById('divOrarioEditRep');
  if (chkEdit && divOraEdit) {
    chkEdit.addEventListener('change', function() {
      divOraEdit.style.display = this.checked ? 'block' : 'none';
      if (this.checked) {
        if (document.querySelectorAll('#feriale_turni_container .shift-row').length === 0) {
          addTurnoRow('feriale', 6);
        }
        if (document.querySelectorAll('#festivo_turni_container .shift-row').length === 0) {
          addTurnoRow('festivo', 12);
        }
      }
    });
  }

  const ferialeInizioEl = document.getElementById('feriale_inizio');
  if (ferialeInizioEl) {
    ferialeInizioEl.addEventListener('input', () => recalcTurni('feriale'));
    ferialeInizioEl.addEventListener('change', () => recalcTurni('feriale'));
  }
  const festivoInizioEl = document.getElementById('festivo_inizio');
  if (festivoInizioEl) {
    festivoInizioEl.addEventListener('input', () => recalcTurni('festivo'));
    festivoInizioEl.addEventListener('change', () => recalcTurni('festivo'));
  }
</script>
</body></html>
