<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>Registrazione Utente — {{ cfg.app_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% include 'base_script.html' %}
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">{{ cfg.logo_emoji }} {{ cfg.app_title }}</a>
    <div>
      <a href="/login" class="btn btn-outline-light btn-sm">Torna al Login</a>
    </div>
  </div>
</nav>

<div class="container flex-grow-1 mb-5" style="max-width: 600px;">
    <h2>Registrazione Nuovo Utente</h2>
    <p class="text-muted">Compila i tuoi dati per registrarti come utente. Riceverai un'e-mail per attivare il tuo account.</p>
    
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <div id="jsErrorAlert" class="alert alert-danger d-none"></div>
    
    <form method="post" action="/register-utente" id="registerUtenteForm" class="mt-3 bg-white p-4 rounded shadow-sm">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label fw-bold">Nome *</label>
                <input type="text" name="nome" class="form-control" required minlength="2">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Cognome *</label>
                <input type="text" name="cognome" class="form-control" required minlength="2">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Password *</label>
                <input type="password" name="password" class="form-control" required minlength="5">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Email *</label>
                <input type="email" name="email" class="form-control" required {% if prefilled_email %}value="{{ prefilled_email }}" readonly{% endif %}>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Telefono/Cell</label>
                <input type="tel" name="telefono" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Reparto *</label>
                <select name="reparto_id" class="form-select" required><option value="" disabled selected>Scegli...</option>{% for r in reparti %}<option value="{{ r.reparto_id }}">{{ r.nome }}</option>{% endfor %}</select>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Sede assegnata *</label>
                <select name="sede_id" class="form-select" required><option value="" disabled selected>Scegli...</option>{% for s in sedi %}<option value="{{ s.sede_id }}">{{ s.nome }}</option>{% endfor %}</select>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-4">Invia Richiesta di Registrazione</button>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('registerUtenteForm');
    if (!form) return;

    form.addEventListener('submit', function(e) {
        const errorAlert = document.getElementById('jsErrorAlert');
        if (errorAlert) {
            errorAlert.classList.add('d-none');
            errorAlert.textContent = '';
        }

        const nomeInput = form.querySelector('[name="nome"]');
        const cognomeInput = form.querySelector('[name="cognome"]');
        const passwordInput = form.querySelector('[name="password"]');
        const emailInput = form.querySelector('[name="email"]');
        const telefonoInput = form.querySelector('[name="telefono"]');

        const nome = nomeInput.value.trim();
        const cognome = cognomeInput.value.trim();
        const password = passwordInput.value.trim();
        const email = emailInput.value.trim();
        const telefono = telefonoInput ? telefonoInput.value.trim() : '';

        // Write trimmed values back
        nomeInput.value = nome;
        cognomeInput.value = cognome;
        passwordInput.value = password;
        emailInput.value = email;
        if (telefonoInput) telefonoInput.value = telefono;

        function showError(msg) {
            e.preventDefault();
            if (errorAlert) {
                errorAlert.textContent = msg;
                errorAlert.classList.remove('d-none');
                errorAlert.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                alert(msg);
            }
        }

        if (!nome || !cognome || !password || !email) {
            showError('Non è possibile inserire dati vuoti o composti solo da spazi.');
            return;
        }

        if (nome.length < 2) {
            showError('Il nome deve contenere almeno 2 caratteri (dopo aver rimosso gli spazi).');
            return;
        }
        if (cognome.length < 2) {
            showError('Il cognome deve contenere almeno 2 caratteri (dopo aver rimosso gli spazi).');
            return;
        }
        if (password.length < 5) {
            showError('La password deve contenere almeno 5 caratteri.');
            return;
        }

        const hasLetterRegex = /[\p{L}]/u;
        if (!hasLetterRegex.test(nome)) {
            showError('Il nome non può contenere solo caratteri speciali o numeri.');
            return;
        }
        if (!hasLetterRegex.test(cognome)) {
            showError('Il cognome non può contenere solo caratteri speciali o numeri.');
            return;
        }
    });
});
</script>
</body></html>
