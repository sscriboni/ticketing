<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>Gestione Categorie — {{ cfg.app_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
{% include 'navbar.html' %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestione Categorie</h2>
    </div>
    <div class="row gap-4">
        <div class="col-12 col-lg-8 bg-white p-4 rounded shadow-sm">
            <h4>Elenco Categorie</h4>
            {% if error == 'in_uso' %}
            <div class="alert alert-danger py-2 mt-2">Impossibile eliminare: la categoria è associata a dei magazzini o ha articoli al suo interno.</div>
            {% endif %}
            <table class="table table-sm table-striped mt-3">
                <thead><tr><th>Nome Categoria</th><th>Azioni</th></tr></thead>
                <tbody>
                {% for c in categorie %}
                <tr>
                    <td><strong>{{ c.nome }}</strong></td>
                    <td>
                        <a href="/admin/categoria/{{ c.categoria_id }}/modifica" class="btn btn-sm btn-warning me-1">Modifica</a>
                        <form method="post" action="/admin/categoria/delete" class="d-inline">
                            <input type="hidden" name="categoria_id" value="{{ c.categoria_id }}">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Eliminare questa categoria?')">Elimina</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
        <div class="col-12 col-lg-4 bg-white p-4 rounded shadow-sm align-self-start">
            <h5>Nuova Categoria</h5>
            <form method="post" action="/admin/categoria" class="mt-3">
                <div class="mb-3"><label class="form-label">Nome</label><input name="nome" class="form-control" required></div>
                <button type="submit" class="btn btn-primary w-100">Salva categoria</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
