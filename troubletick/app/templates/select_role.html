<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>Seleziona Ruolo — {{ cfg.app_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-vh: 100vh;
        }
        .role-card {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease-in-out;
            position: relative;
        }
        .role-card:hover {
            border-color: #0d6efd;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.1);
            background-color: #f8f9ff;
        }
        .role-card input[type="radio"] {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 1.25em;
            height: 1.25em;
        }
        .role-card.selected {
            border-color: #0d6efd;
            background-color: #eff6ff;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.15);
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    {% include 'navbar.html' %}

    <div class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="card shadow-lg p-4 border-0" style="max-width: 620px; width: 100%; border-radius: 16px;">
            <div class="text-center mb-4">
                <div class="bg-primary text-white d-inline-flex p-3 rounded-circle mb-3 shadow-sm">
                    <i class="bi bi-person-gear fs-3"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Seleziona Ruolo Operativo</h3>
                <p class="text-muted small">Il tuo account dispone di più ruoli abilitati. Seleziona il ruolo che desideri utilizzare per accedere alla rispettiva Home Page.</p>
            </div>

            <form method="post" action="/login/select-role" id="roleForm">
                <div class="d-flex flex-column gap-3 mb-4">
                    {% for role in roles %}
                    <label class="role-card p-3 d-flex align-items-start gap-3 {% if role.is_current %}border-primary bg-light{% endif %}" id="label_{{ role.nome }}">
                        <input type="radio" name="ruolo" value="{{ role.nome }}" class="form-check-input mt-1" required {% if role.is_current or loop.first %}checked{% endif %}>
                        <div class="role-icon-container text-primary fs-2">
                            <i class="bi {{ role.icon }}"></i>
                        </div>
                        <div class="flex-grow-1 pe-4">
                            <div class="d-flex align-items-center gap-2 mb-1">
                                <h5 class="mb-0 fw-bold text-dark">{{ role.title }}</h5>
                                <span class="badge {{ role.badge_class }} small">{{ role.nome }}</span>
                                {% if role.is_current %}
                                <span class="badge bg-success small"><i class="bi bi-check-circle me-1"></i>Attivo</span>
                                {% endif %}
                            </div>
                            <div class="text-primary fw-semibold small mb-1">
                                <i class="bi bi-house-door-fill me-1"></i> <strong>Home Page:</strong> {{ role.home_page }}
                            </div>
                            <div class="text-muted small lh-sm">{{ role.desc }}</div>
                        </div>
                    </label>
                    {% endfor %}
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 py-2.5 fw-bold rounded-3 shadow-sm">
                    Conferma e Vai alla Home Page <i class="bi bi-arrow-right-short fs-4 align-middle"></i>
                </button>
            </form>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0 small">{{ cfg.footer_text }}</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.role-card');
            
            function updateSelection() {
                cards.forEach(c => {
                    const radio = c.querySelector('input[type="radio"]');
                    if (radio && radio.checked) {
                        c.classList.add('selected');
                    } else {
                        c.classList.remove('selected');
                    }
                });
            }

            cards.forEach(c => {
                c.addEventListener('click', function() {
                    const radio = this.querySelector('input[type="radio"]');
                    if (radio) {
                        radio.checked = true;
                        updateSelection();
                    }
                });
            });

            updateSelection();
        });
    </script>
</body>
</html>
