<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>Gestione Marche — {{ cfg.app_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
{% include 'navbar.html' %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-tags text-primary me-2"></i>Gestione Marche Automezzi</h2>
        <a href="/admin/automezzi/gestione" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Torna alla Gestione
        </a>
    </div>

    <div class="row g-4">
        <!-- Elenco Marche -->
        <div class="col-12 col-lg-8 bg-white p-4 rounded shadow-sm">
            <h4>Elenco Marche Registrate</h4>
            <table class="table table-sm table-striped mt-3 align-middle">
                <thead>
                    <tr>
                        <th>Nome Marca</th>
                        <th class="text-end">Azioni</th>
                    </tr>
                </thead>
                <tbody>
                {% for marca in marche %}
                <tr>
                    <td><strong>{{ marca.nome }}</strong></td>
                    <td class="text-end">
                        <div class="d-inline-flex gap-2">
                            <button class="btn btn-sm btn-warning" onclick="showEditModal({{ marca.marca_id }}, '{{ marca.nome }}')">Modifica</button>
                            <form method="post" action="../automezzi/marche/elimina/{{ marca.marca_id }}" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Eliminare questa marca? Tutti i veicoli associati a questa marca potrebbero risentirne.')">Elimina</button>
                            </form>
                        </div>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="2" class="text-center text-muted py-3">Nessuna marca registrata.</td>
                </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>

        <!-- Nuova Marca -->
        <div class="col-12 col-lg-4 bg-white p-4 rounded shadow-sm">
            <h5>Nuova Marca</h5>
            <form method="post" action="../automezzi/marche/nuova" class="mt-3">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nome Marca *</label>
                    <input name="nome" class="form-control" placeholder="Es. Fiat" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Salva Marca</button>
            </form>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editMarcaModal" tabindex="-1" aria-labelledby="editMarcaModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title fw-bold" id="editMarcaModalLabel"><i class="bi bi-pencil-square me-2"></i> Modifica Marca</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="editMarcaForm" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nome Marca *</label>
                        <input name="nome" id="editMarcaNome" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 fw-bold">Salva Modifiche</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    let editMarcaModalEl;

    document.addEventListener('DOMContentLoaded', () => {
        editMarcaModalEl = new bootstrap.Modal(document.getElementById('editMarcaModal'));
    });

    function showEditModal(id, nome) {
        document.getElementById('editMarcaNome').value = nome;
        const form = document.getElementById('editMarcaForm');
        form.action = `../automezzi/marche/modifica/${id}`;
        editMarcaModalEl.show();
    }
</script>
</body>
</html>
