<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>Documentazione — {{ cfg.app_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin-top: 1.5rem; margin-bottom: 1rem; }
        .markdown-body h1 { border-bottom: 1px solid #dee2e6; padding-bottom: 0.5rem; }
        .markdown-body pre { background-color: #f8f9fa; padding: 1rem; border-radius: 0.375rem; overflow-x: auto; }
        .markdown-body code { background-color: #f8f9fa; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-family: monospace; }
        .mermaid { display: flex; justify-content: center; margin: 1.5rem 0; }
    </style>
</head>
<body class="bg-light">
{% include 'navbar.html' %}
<div class="container py-4">
    <div class="bg-white p-4 rounded shadow-sm markdown-body">
        <div id="content"></div>
    </div>
</div>
<script>
    // Inizializza mermaid
    mermaid.initialize({ startOnLoad: false, theme: 'default' });

    // Renderizza il markdown
    document.getElementById('content').innerHTML = marked.parse({{ content|tojson }});

    // Converte i blocchi di codice mermaid in div per il rendering grafico
    document.querySelectorAll('pre code.language-mermaid').forEach((block) => {
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = block.textContent;
        block.parentElement.replaceWith(div);
    });

    // Avvia il rendering dei grafici
    mermaid.run();
</script>
</body>
</html>
